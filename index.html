main{max-width:none;margin:0;padding:0}
button,input{font:inherit;color:var(--tx)}button{cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}

.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;text-align:left;width:100%}
.opt b{display:block}.opt span{color:var(--mu);font-size:.88rem}
.opt.on{border-color:var(--ac);background:var(--acl)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.g3 .opt{text-align:center}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-weight:700;width:100%;margin-top:18px}
.btn.s{width:auto;margin:10px 8px 0 0;padding:10px 18px}.btn.gh2{background:none;color:var(--ac);border:1px solid var(--ac)}

.sp{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:var(--ac2)}.tg{margin-left:auto;color:var(--ac);font-weight:700}
.lo{display:inline-block;background:var(--acl);color:var(--ac);font-weight:700;font-size:.78rem;padding:2px 9px;border-radius:6px;margin-right:6px}
.q{font-size:1.2rem;font-weight:700;margin:10px 0 12px}
.fb{padding:12px 14px;border-radius:12px;margin:12px 0 0;background:var(--acl)}
input.t{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.lb.me{background:var(--acl);border-radius:10px;padding:10px}

ul{margin:6px 0;padding-left:20px}

/* Extra afwerking */
body{background:radial-gradient(ellipse at 8% 0%,rgba(124,105,235,.16),transparent 34%),radial-gradient(ellipse at 95% 12%,rgba(242,195,107,.09),transparent 28%),var(--bg)}

.card{box-shadow:0 8px 28px rgba(20,50,28,.055);transition:transform .18s ease,box-shadow .18s ease}

.mission p{margin:2px 0 0;color:var(--mu);font-size:.88rem}
.mission button{margin-left:auto;flex:none;width:auto;margin-top:0;padding:9px 13px}

.pro-card{margin-top:18px;padding:18px;border-radius:18px;text-align:left;border:1px solid rgba(226,174,77,.55);background:linear-gradient(135deg,rgba(115,91,215,.13),rgba(237,183,82,.16));box-shadow:0 10px 28px rgba(99,78,165,.10)}

.pro-gem{width:46px;height:46px;display:grid;place-items:center;flex:none;border-radius:15px;background:linear-gradient(135deg,#7564df,#f1c36b);color:white;font-size:1.55rem;box-shadow:0 6px 16px rgba(117,100,223,.25)}

.pro-features{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stats-grid>div{background:var(--acl);border-radius:12px;padding:10px 6px;text-align:center}

.streak-pill{background:rgba(242,169,74,.18);color:#c18425;border-radius:99px;padding:6px 11px;font-weight:800}
.trophy-row{display:flex;gap:8px;flex-wrap:wrap}

textarea.t,select.t{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.ai-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.ai-th{position:relative;width:110px;height:110px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}.ai-th img{width:100%;height:100%;object-fit:cover}.ai-th button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.ai-spin{width:44px;height:44px;margin:18px auto 0;border-radius:50%;border:5px solid var(--bd);border-top-color:var(--ac);animation:aispin 1s linear infinite}@keyframes aispin{to{transform:rotate(360deg)}}
@media(min-width:860px){.grid:not(.g2):not(.g3):not(.home-grid):not(.menu-grid){grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.home-grid{grid-template-columns:repeat(4,1fr)!important}.menu-grid{grid-template-columns:repeat(3,1fr)}.q{font-size:1.6rem}.lead{max-width:760px}.card{padding:24px}}

.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:14px}

.nvs{display:flex;flex-direction:column;gap:2px}
.nvh{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--mu);margin:12px 10px 4px}
.nv{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--tx);font-weight:600;width:100%}
.nv span{width:24px;text-align:center;font-size:1.15rem}.nv:hover{background:var(--bg)}.nv.on{background:var(--acl);color:var(--ac)}
.acc{margin-top:auto;border:1px solid var(--bd);border-radius:16px;padding:12px}
.content{padding:26px 34px 70px;max-width:1280px;width:100%;margin:0 auto;min-width:0}
.mtop,.scrim{display:none}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:center;border-radius:24px;padding:30px;background:linear-gradient(135deg,#4b3fc0,#7b5cf0 60%,#c98ad8);color:#fff;margin-bottom:22px}
.hero h1{margin:4px 0 6px;font-size:2.1rem}.hero p{opacity:.92;margin:0 0 14px}.hero .eyebrow{color:#ffe8a8}

.hero-rank{font-size:3rem;line-height:1.1}.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff}.hero-sub{font-size:.9rem;opacity:.92}
.streak{display:inline-block;margin-top:10px;background:rgba(0,0,0,.22);padding:4px 12px;border-radius:99px;font-weight:700;font-size:.88rem}
.sec{font-size:.78rem;font-weight:800;letter-spacing:.1em;color:var(--mu);margin:4px 2px 12px}
.home-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{position:relative;text-align:left;border:0;border-radius:20px;padding:20px;color:#fff;min-height:172px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(30,30,80,.18);transition:transform .15s,box-shadow .15s}

.tile-ico{font-size:2.4rem}.tile-name{font-weight:800;font-size:1.2rem;margin-top:6px}.tile-desc{opacity:.92;font-size:.9rem;margin-top:2px}.tile-go{margin-top:auto;padding-top:12px;font-weight:700}
.t-fr{background:linear-gradient(135deg,#4f6df0,#7a5cf0)}.t-ak{background:linear-gradient(135deg,#e8a33a,#e4704a)}.t-bio{background:linear-gradient(135deg,#25a97f,#3f8fd0)}.t-ai{background:linear-gradient(135deg,#8a4fe0,#d54f9a)}

.logo.big{width:72px;height:72px;font-size:2.2rem;border-radius:20px;background:rgba(255,255,255,.2)}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
@media(max-width:1100px){.home-cols{grid-template-columns:1fr}}
@media(max-width:900px){
 .shell{display:block}.side{display:none}

}

function frStart() {

function frChoose(v) {
    const s = S.fr;
    if (!s || s.choice !== null)
        return;
    const q = s.list[s.i];
    s.choice = v;
    s.answered++;
    const ok = v === q.a;
    if (ok) {
        s.ok++;
        S.me.xp += 20;
        S.me.correct++;
    }
    else if (proActive) {
        s.lives--;

        s.done = true;
    save();
    render();
}

    render();
}
