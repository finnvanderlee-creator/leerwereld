croscoop?", "o": ["Lamp → preparaat → lenzen → oog", "Oog → lamp → preparaat → voet", "Preparaat → lamp → oog → tafel", "Objectief → lamp → voet → oog"], "a": 0, "why": "Het licht komt van onderen, gaat door het preparaat en de lenzen naar je oog."}, {"q": "Wat gebeurt er als je het diafragma verder dichtdraait?", "o": ["Er valt minder licht door", "Er valt meer licht door", "De vergroting wordt groter", "Het preparaat wordt verplaatst"], "a": 0, "why": "Een kleiner diafragma laat minder licht door."}]}, {"title": "2. Werken met een microscoop", "desc": "Oefen de juiste volgorde bij het zoeken en scherpstellen.", "questions": [{"q": "Met welke vergroting begin je volgens de leerstof?", "o": ["De kleinste vergroting", "De grootste vergroting", "Altijd 40×", "Dat maakt niet uit"], "a": 0, "why": "Begin met de kleinste vergroting; dan vind je het voorwerp makkelijker."}, {"q": "Waarom begin je met de kleinste vergroting?", "o": ["Je vindt het voorwerp makkelijker en hebt minder kans dat het objectief het preparaat raakt", "Dan is het beeld altijd groter", "Dan heb je geen licht nodig", "Dan werkt het diafragma niet"], "a": 0, "why": "Het beeldveld is groter en de afstand tot het preparaat is veiliger."}, {"q": "Waar leg je het preparaat voordat je gaat kijken?", "o": ["Midden boven de opening in de tafel", "Naast de microscoop", "Op het oculair", "Onder het voetstuk"], "a": 0, "why": "Leg het preparaat midden boven de opening in de tafel."}, {"q": "Wat doe je voordat je door het oculair kijkt bij de eerste scherpstelling?", "o": ["Draai de tubus omhoog of de tafel omlaag en kijk van opzij", "Draai de kleine schroef helemaal vast", "Zet het diafragma dicht en haal het preparaat weg", "Kijk meteen door het oculair en draai snel"], "a": 0, "why": "Kijk van opzij en zorg dat het objectief boven het preparaat staat zonder het te raken."}, {"q": "Waarom kijk je van opzij wanneer je het objectief dichterbij brengt?", "o": ["Om te voorkomen dat het objectief tegen het preparaat komt", "Om de kleur te zien", "Om de vergroting te berekenen", "Om het oculair schoon te maken"], "a": 0, "why": "Zo kun je de afstand controleren en botsen voorkomen."}, {"q": "Wat doe je nadat je van opzij de juiste beginpositie hebt ingesteld?", "o": ["Kijk door het oculair en draai de grote schroef langzaam", "Haal het preparaat weg", "Draai meteen naar de grootste vergroting", "Verwijder het oculair"], "a": 0, "why": "Kijk door het oculair en stel met de grote schroef langzaam scherp."}, {"q": "Wanneer gebruik je de kleine schroef?", "o": ["Om het beeld nauwkeurig scherp te stellen", "Om het preparaat vast te klemmen", "Om het licht aan te zetten", "Om een ander objectief te kiezen"], "a": 0, "why": "De kleine schroef is voor de nauwkeurige scherpstelling."}, {"q": "Je wilt een groter beeld. Wat doe je nadat het beeld bij de kleinste vergroting scherp is?", "o": ["Zet het voorwerp in het midden en draai naar een groter objectief", "Verplaats het preparaat naar de rand", "Draai aan de grote schroef terwijl je wisselt", "Haal het dekglaasje weg"], "a": 0, "why": "Centreer het voorwerp voordat je naar een groter objectief schakelt."}, {"q": "Waarom moet je het voorwerp in het midden zetten voordat je vergroot?", "o": ["Bij grotere vergroting zie je een kleiner deel van het preparaat", "Het preparaat wordt dan dunner", "Het diafragma gaat vanzelf open", "De lamp wordt feller"], "a": 0, "why": "Bij een grotere vergroting wordt het beeldveld kleiner."}, {"q": "Welke schroef gebruik je bij een grotere vergroting om opnieuw scherp te stellen?", "o": ["De kleine schroef", "Alleen de grote schroef", "De schroef van de preparaatklem", "De schroef van het voetstuk"], "a": 0, "why": "Bij grotere vergroting stel je nauwkeurig bij met de kleine schroef."}, {"q": "Waarom gebruik je bij sterke vergroting niet zomaar de grote schroef?", "o": ["Het objectief kan tegen het preparaat komen", "De lamp gaat uit", "Het oculair wordt kleiner", "Het preparaat verandert van kleur"], "a": 0, "why": "De grote schroef beweegt te ver en kan het objectief tegen het preparaat laten komen."}, {"q": "Je ziet geen beeld. Wat controleer je als eerste bij de revolver?", "o": ["Of het objectief goed boven het preparaat staat", "Of de voet schoon is", "Of het oculair op tafel ligt", "Of de klemmen los zijn"], "a": 0, "why": "Een verkeerd gedraaide revolver kan betekenen dat het objectief niet goed staat."}, {"q": "Je ziet geen beeld en het preparaat ligt naast de opening. Wat is de oplossing?", "o": ["Leg het preparaat goed boven de opening", "Draai het oculair los", "Gebruik meteen de grootste vergroting", "Haal de lamp eruit"], "a": 0, "why": "Het preparaat moet boven de opening in de tafel liggen."}, {"q": "Je ziet geen beeld. Je gebruikt een erg sterke vergroting. Wat kan helpen?", "o": ["Teruggaan naar een kleinere vergroting", "Het diafragma helemaal dichtdraaien", "Het preparaat dubbelvouwen", "De kleine schroef verwijderen"], "a": 0, "why": "Een te sterke vergroting kan het lastig maken het voorwerp te vinden."}, {"q": "Je ziet geen beeld en het diafragma laat geen licht door. Wat doe je?", "o": ["Het diafragma zo instellen dat er licht doorvalt", "De revolver verwijderen", "De tafel afdekken", "Het oculair omdraaien"], "a": 0, "why": "Zonder licht door het preparaat kun je geen beeld zien."}, {"q": "Je ziet geen beeld en de lamp staat uit. Wat doe je?", "o": ["De lamp aanzetten", "De vergroting verdubbelen", "Het dekglaasje verwijderen", "De tafel hoger zetten"], "a": 0, "why": "De lamp moet branden om het preparaat te verlichten."}, {"q": "Bij sterke vergroting is het beeld niet meer scherp. Welke handeling past het best?", "o": ["Voorzichtig met de kleine schroef bijstellen", "Snel met de grote schroef draaien", "Het preparaat van de tafel halen", "De revolver losmaken"], "a": 0, "why": "De kleine schroef is bedoeld voor nauwkeurig scherpstellen."}, {"q": "Wat doe je als je na het wisselen naar een groter objectief het voorwerp kwijt bent?", "o": ["Ga terug naar de kleinere vergroting, centreer opnieuw en probeer opnieuw", "Draai de grote schroef snel omlaag", "Kijk alleen naar de lamp", "Verwijder het preparaatklemmetje"], "a": 0, "why": "Eerst terug naar een overzichtelijk beeld en het voorwerp opnieuw in het midden zetten."}, {"q": "Waarom is het handig om het preparaat goed vast te zetten?", "o": ["Het blijft op de juiste plek liggen", "De vergroting wordt hoger", "De cellen worden groter", "Het diafragma gaat open"], "a": 0, "why": "De klemmen voorkomen dat het preparaat verschuift."}, {"q": "Wat is een goede gewoonte als je klaar bent met zoeken bij de kleinste vergroting?", "o": ["Pas daarna groter vergroten als je het onderwerp hebt gevonden en gecentreerd", "Altijd meteen naar de grootste vergroting draaien", "De lamp uitzetten terwijl je kijkt", "De grote schroef blijven draaien"], "a": 0, "why": "Eerst vinden en centreren, daarna pas vergroten."}]}, {"title": "3. Een preparaat maken", "desc": "Oefen materialen, stappen en het herkennen van fouten in een preparaat.", "questions": [{"q": "Hoe heet het glaasje waarop je het materiaal legt?", "o": ["Voorwerpglaasje", "Dekglaasje", "Oculair", "Objectief"], "a": 0, "why": "Het materiaal komt op het voorwerpglaasje."}, {"q": "Waarmee dek je het materiaal op het voorwerpglaasje af?", "o": ["Dekglaasje", "Filterpapier", "Pincet", "Preparenaald"], "a": 0, "why": "Het dekglaasje ligt boven op het materiaal en de vloeistof."}, {"q": "Waarvoor gebruik je een druppelpipet?", "o": ["Om een druppel vloeistof op het glaasje te doen", "Om het preparaat te vergroten", "Om cellen te snijden", "Om door de microscoop te kijken"], "a": 0, "why": "Met de druppelpipet breng je een druppel vloeistof aan."}, {"q": "Waarvoor gebruik je een pincet bij het maken van een preparaat?", "o": ["Om een klein stukje materiaal vast te pakken", "Om het licht te regelen", "Om scherp te stellen", "Om de vergroting te kiezen"], "a": 0, "why": "Met een pincet kun je een dun stukje materiaal "q": "Wat doet een kleurstof bij een preparaat?", "o": ["Maakt onderdelen of structuren beter zichtbaar", "Vergroot automatisch het beeld", "Vervangt het dekglaasje", "Zet de lamp aan"], "a": 0, "why": "Kleuring zorgt voor meer contrast zodat structuren beter te zien zijn."}, {"q": "Wat is een aanwijzing dat een preparaat goed is gemaakt?", "o": ["Het materiaal ligt dun en vlak, zonder storende luchtbellen of grote overlap", "Er zitten veel zwarte luchtbellen in", "Het materiaal ligt dubbelgevouwen", "Het dekglaasje ligt naast het voorwerpglaasje"], "a": 0, "why": "Een goed preparaat toont het materiaal zo vlak en duidelijk mogelijk."}]}];
let sectionIndex=0, pool=[], index=0, score=0, answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function showMenu(){
 $('quiz').classList.add('hidden');$('result').classList.add('hidden');$('menu').classList.remove('hidden');
 $('menu').innerHTML=DATA.map((s,i)=>`<button class="choice" data-section="${i}"><b>${s.title}</b><br><span class="muted">${s.desc}</span><br><span class="pill" style="margin-top:8px">20 vragen · Start →</span></button>`).join('');
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>start(+b.dataset.section));
}
function start(i){
 sectionIndex=i;pool=shuffle(DATA[i].questions);index=0;score=0;answered=false;
 $('menu').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion();
}
function renderQuestion(){
 const item=pool[index];answered=false;
 $('section').textContent=DATA[sectionIndex].title;
 $('counter').textContent=`Vraag ${index+1} van ${pool.length}`;
 $('progress').style.width=`${index/pool.length*100}%`;
 $('question').textContent=item.q;
 $('feedback').classList.add('hidden');$('next').classList.add('hidden');
 $('answers').innerHTML=item.o.map((v,j)=>`<button class="choice" data-answer="${j}">${String.fromCharCode(65+j)}. ${v}</button>`).join('');
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(+b.dataset.answer));
}
function choose(n){
 if(answered)return;answered=true;const item=pool[index],correct=n===item.a;
 if(correct)score++;
 document.querySelectorAll('[data-answer]').forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('good');else if(j===n)b.classList.add('bad')});
 $('feedback').classList.remove('hidden');
 $('feedback').innerHTML=(correct?'✅ <b>Helemaal goed!</b> ':'❌ <b>Niet helemaal.</b> Het juiste antwoord is: <b>'+item.o[item.a]+'</b>. ')+item.why;
 $('next').classList.remove('hidden');$('progress').style.width=`${(index+1)/pool.length*100}%`;
}
function next(){
 index++;if(index>=pool.length){showResult();return}renderQuestion();
}
function showResult(){
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
 const pct=Math.round(score/pool.length*100);
 $('result').innerHTML=`<div class="pill">ONDERDEEL AFGEROND</div><h2 style="font-size:2rem;margin-top:10px">${score} / ${pool.length} goed</h2><p><b>${pct}%</b> goed. ${pct>=85?'Heel sterk gedaan! 🎉':pct>=60?'Goed bezig. Herhaal de vragen die lastig waren.':'Lees de uitleg nog eens en probeer opnieuw. 💪'}</p><div class="actions"><button class="btn" id="retry">Nog een ronde</button><button class="btn ghost" id="back">Andere onderdelen</button></div>`;
 $('retry').onclick=()=>start(sectionIndex);$('back').onclick=showMenu;
}
$('next').onclick=next;$('quit').onclick=showMenu;showMenu();
</script>
</body></html>
